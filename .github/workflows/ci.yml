name: Validate learning platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content, tests and portable build
        run: npm run verify:local
      - name: Validate generated sources are committed
        run: git diff --exit-code -- public/curriculum.js
      - name: Validate Pages artifact
        run: npm run build:pages
